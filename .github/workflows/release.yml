# A release (D48): push a tag that matches iconkit.__version__ (e.g. v0.7.1) and this checks the updater, builds the zip
# (the app's code + manifest.json) with its .sha256, and publishes both as a GitHub release, which the app's updater
# finds (iconkit/update.py REPO). Notes: generated from the commits, then replaced (gh release edit --notes-file) with
# the Bug Fixes / Features / Performance Improvements notes the in-app Update dialog shows.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag is the app's version
        run: python -c "import iconkit, os, sys; t = os.environ['GITHUB_REF_NAME'].lstrip('v'); sys.exit(0 if t == iconkit.__version__ else f'tag {t} is not iconkit.__version__ {iconkit.__version__}')"
      - name: Updater self-test (stage, apply, rollback, the release's contents)
        run: python -m iconkit.update test
      - name: Build
        run: python -m iconkit.update build dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "BG3 Icon Generator $GITHUB_REF_NAME"
